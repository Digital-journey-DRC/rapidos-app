group 'com.eopeter.fluttermapboxnavigation'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    ext.android_gradle_version = '8.6.0'
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://api.mapbox.com/downloads/v2/releases/maven'
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                username = "mapbox"
                def token = project.findProperty('MAPBOX_DOWNLOADS_TOKEN') ?: 
                           rootProject.findProperty('MAPBOX_DOWNLOADS_TOKEN') ?:
                           System.getenv('MAPBOX_DOWNLOADS_TOKEN')
                password = token ?: ''
                if (!password || password.isEmpty()) {
                    println("WARNING: MAPBOX_DOWNLOADS_TOKEN isn't set. Mapbox dependencies may fail to download.")
                    println("To fix: Add MAPBOX_DOWNLOADS_TOKEN to android/gradle.properties or set it as environment variable.")
                    // Allow build to continue but Mapbox downloads will fail if needed
                }
            }
        }
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$android_gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.mapbox.gradle.plugins:access-token:0.4.0"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2' }
        maven {
            url 'https://api.mapbox.com/downloads/v2/releases/maven'
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                username = "mapbox"
                def token = project.findProperty('MAPBOX_DOWNLOADS_TOKEN') ?: 
                           rootProject.findProperty('MAPBOX_DOWNLOADS_TOKEN') ?:
                           System.getenv('MAPBOX_DOWNLOADS_TOKEN')
                password = token ?: ''
                if (!password || password.isEmpty()) {
                    println("WARNING: MAPBOX_DOWNLOADS_TOKEN isn't set. Mapbox dependencies may fail to download.")
                    println("To fix: Add MAPBOX_DOWNLOADS_TOKEN to android/gradle.properties or set it as environment variable.")
                    // Allow build to continue but Mapbox downloads will fail if needed
                }
            }
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.eopeter.fluttermapboxnavigation'
    compileSdkVersion 36
    // Force NDK r26+ pour le support 16KB (requis par Google Play)
    ndkVersion "26.1.10909125"

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lintOptions {
        disable 'InvalidPackage'
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures{
        viewBinding = true
    }
    
    // Support for 16KB page size devices (required by Play Store before November 1, 2025)
    // With AGP 8.1+, setting useLegacyPackaging = false enables automatic 16KB page size support
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // Mapbox Navigation SDK
    implementation "com.mapbox.navigation:copilot:2.16.0"
    implementation "com.mapbox.navigation:ui-app:2.16.0"
    implementation "com.mapbox.navigation:ui-dropin:2.16.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.jakewharton.timber:timber:4.7.1'
    implementation 'com.google.code.gson:gson:2.8.9'

    implementation "androidx.core:core-ktx:1.9.0"
    implementation "com.google.android.material:material:1.8.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "com.google.android.gms:play-services-location:21.0.1"
    // Désactivé LeakCanary pour éviter l'installation automatique de l'APK "Leaks" en mode debug
    // debugImplementation "com.squareup.leakcanary:leakcanary-android:2.9.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
}
